name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 10.0.x

jobs:
  ci:
    name: Build & Test (.NET 10 + Analyzer)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DiscordGeminiAdmin.slnx

      - name: Build solution (warnings as errors + DGA0001)
        run: dotnet build DiscordGeminiAdmin.slnx --configuration Release --no-restore -warnaserror

      - name: Run unit & architecture tests
        run: dotnet test DiscordGeminiAdmin.slnx --configuration Release --no-build

  docker:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image: ${{ steps.image.outputs.name }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          IMAGE_NAME="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: dga-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: check_creds
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ VPS_SSH_KEY secret is not configured yet. Skipping SSH deploy."
          elif [ -z "${DISCORD_TOKEN}" ] || [ -z "${GEMINI_API_KEY}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ DISCORD_TOKEN or GEMINI_API_KEY is not configured in GitHub Secrets. Skipping container start."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare SSH
        if: steps.check_creds.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_dga_deploy
          printf '%s\n' "${VPS_SSH_KEY}" | tr -d '\r' > ~/.ssh/id_dga_deploy
          ssh-keyscan -p "${VPS_PORT}" "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Create production .env file
        if: steps.check_creds.outputs.ready == 'true'
        env:
          IMAGE_NAME: ${{ needs.docker.outputs.image }}
          IMAGE_TAG: ${{ needs.docker.outputs.sha_tag }}
          DOTNET_ENVIRONMENT: ${{ vars.DOTNET_ENVIRONMENT || 'Production' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'dga' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'discord_gemini_admin' }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT || '5444' }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODERATION_MODEL: ${{ vars.GEMINI_MODERATION_MODEL || 'gemini-3.8-flash' }}
          GEMINI_STRUCTURE_MODEL: ${{ vars.GEMINI_STRUCTURE_MODEL || 'gemini-3.8-flash' }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-001' }}
          GEMINI_EMBEDDING_DIMENSIONS: ${{ vars.GEMINI_EMBEDDING_DIMENSIONS || '768' }}
          AUTOBAN_ENABLED: ${{ vars.AUTOBAN_ENABLED || 'true' }}
          AUTOBAN_DRY_RUN: ${{ vars.AUTOBAN_DRY_RUN || 'true' }}
          AUTOBAN_MIN_CONFIDENCE: ${{ vars.AUTOBAN_MIN_CONFIDENCE || '0.95' }}
          AUTOBAN_MIN_EVIDENCE: ${{ vars.AUTOBAN_MIN_EVIDENCE || '2' }}
          AUTOBAN_MAX_PER_HOUR: ${{ vars.AUTOBAN_MAX_PER_HOUR || '3' }}
          DIGEST_CRON: ${{ vars.DIGEST_CRON || '0 * * * *' }}
          RETENTION_HOURS: ${{ vars.RETENTION_HOURS || '48' }}
        run: |
          install -m 600 /dev/null deploy.env
          {
            printf 'IMAGE_NAME=%s\n' "${IMAGE_NAME}"
            printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}"
            printf 'DOTNET_ENVIRONMENT=%s\n' "${DOTNET_ENVIRONMENT}"
            printf 'POSTGRES_USER=%s\n' "${POSTGRES_USER}"
            printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD}"
            printf 'POSTGRES_DB=%s\n' "${POSTGRES_DB}"
            printf 'POSTGRES_PORT=%s\n' "${POSTGRES_PORT}"
            printf 'ConnectionStrings__DefaultConnection=Host=dga-db;Port=5432;Database=%s;Username=%s;Password=%s\n' "${POSTGRES_DB}" "${POSTGRES_USER}" "${POSTGRES_PASSWORD}"
            printf 'Discord__Token=%s\n' "${DISCORD_TOKEN}"
            printf 'Gemini__ApiKey=%s\n' "${GEMINI_API_KEY}"
            printf 'Gemini__Models__Moderation=%s\n' "${GEMINI_MODERATION_MODEL}"
            printf 'Gemini__Models__Structure=%s\n' "${GEMINI_STRUCTURE_MODEL}"
            printf 'Gemini__Models__Embedding=%s\n' "${GEMINI_EMBEDDING_MODEL}"
            printf 'Gemini__EmbeddingDimensions=%s\n' "${GEMINI_EMBEDDING_DIMENSIONS}"
            printf 'AutoBan__Enabled=%s\n' "${AUTOBAN_ENABLED}"
            printf 'AutoBan__DryRun=%s\n' "${AUTOBAN_DRY_RUN}"
            printf 'AutoBan__MinConfidence=%s\n' "${AUTOBAN_MIN_CONFIDENCE}"
            printf 'AutoBan__MinEvidenceMessages=%s\n' "${AUTOBAN_MIN_EVIDENCE}"
            printf 'AutoBan__MaxPerHour=%s\n' "${AUTOBAN_MAX_PER_HOUR}"
            printf 'Digest__Cron=%s\n' "${DIGEST_CRON}"
            printf 'Retention__MessageBufferHours=%s\n' "${RETENTION_HOURS}"
          } > deploy.env

      - name: Upload deployment files & start services
        if: steps.check_creds.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_dga_deploy -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "mkdir -p ${DEPLOY_PATH}"
          scp -i ~/.ssh/id_dga_deploy -P "${VPS_PORT}" docker-compose.yml deploy.env "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/"
          ssh -i ~/.ssh/id_dga_deploy -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "cd ${DEPLOY_PATH} && \
            mv deploy.env .env && \
            chmod 600 .env && \
            printf '%s' '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin && \
            docker compose pull dga-db dga-bot && \
            docker compose up -d --remove-orphans && \
            sleep 5 && \
            docker ps --filter 'name=dga' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' && \
            docker compose logs --tail=50 dga-bot && \
            docker image prune -f"
