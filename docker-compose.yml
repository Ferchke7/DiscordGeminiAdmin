services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dga}
      POSTGRES_DB: ${POSTGRES_DB:-discord_gemini_admin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dga-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dga} -d ${POSTGRES_DB:-discord_gemini_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-discord_gemini_admin};Username=${POSTGRES_USER:-dga};Password=${POSTGRES_PASSWORD:-dga}}
      Discord__Token: ${Discord__Token}
      Gemini__ApiKey: ${Gemini__ApiKey}
      Gemini__Models__Moderation: ${Gemini__Models__Moderation:-gemini-2.5-flash}
      Gemini__Models__Structure: ${Gemini__Models__Structure:-gemini-2.5-pro}
      Gemini__Models__Embedding: ${Gemini__Models__Embedding:-text-embedding-004}
      Gemini__EmbeddingDimensions: ${Gemini__EmbeddingDimensions:-768}
      AutoBan__Enabled: ${AutoBan__Enabled:-true}
      AutoBan__DryRun: ${AutoBan__DryRun:-true}
      AutoBan__MinConfidence: ${AutoBan__MinConfidence:-0.95}
      AutoBan__MinEvidenceMessages: ${AutoBan__MinEvidenceMessages:-3}
      AutoBan__MaxPerHour: ${AutoBan__MaxPerHour:-3}
      Digest__Cron: ${Digest__Cron:-0 * * * *}
      Retention__MessageBufferHours: ${Retention__MessageBufferHours:-24}

volumes:
  dga-pg:
